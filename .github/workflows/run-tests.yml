name: Tests

on: [push, pull_request]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest]
        php: ["8.2", "8.3", "8.4"]
        laravel: ["^11.0", "^12.0", "^13.0"]
        dependency-version: [prefer-lowest, prefer-stable]
        include:
          - laravel: "^11.0"
            testbench: "^9.0"
          - laravel: "^12.0"
            testbench: "^10.0"
          - laravel: "^13.0"
            testbench: "^11.0"
        exclude:
          - php: "8.2"
            laravel: "^13.0"

    name: P${{ matrix.php }} - L${{ matrix.laravel }} - ${{ matrix.dependency-version }} - ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv, imagick, fileinfo
          coverage: none

      - name: Setup Problem Matches
        run: |
          echo "::add-matcher::${{ runner.tool_cache }}/php.json"
          echo "::add-matcher::${{ runner.tool_cache }}/phpunit.json"

      # Every laravel/framework 11.x release carries a security advisory, which Composer
      # refuses to install by default. Laravel 11 is still supported, so lift the block for
      # those jobs only: this is a test install, and nothing it resolves ships.
      - name: Allow Laravel 11 releases with security advisories
        if: matrix.laravel == '^11.0'
        run: composer config policy.advisories.block false

      - name: Install dependencies
        run: |
          composer require "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" --no-interaction --no-update
          composer update --${{ matrix.dependency-version }} --prefer-dist --no-interaction

      - name: Execute tests
        run: vendor/bin/pest
